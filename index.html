<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <script>
        function validateForm() {
            var a = document.getElementById("n1").value; 
            var b = document.getElementById("n2").value; 
            var c = document.getElementById("n3").value; 
            var d = document.getElementById("n4").value; 

            /* Check  any field is empty */
            if (a == "" || b == "" || c == "" || d == "") {
                alert("All fields are mandatory!");
                return false;
            }

            /* Check  contact number is exactly 10 digits*/
            if (b.length != 10 || isNaN(b)) { 
                alert("Contact number should be exactly 10 digits and must be numeric!");
                return false;
            }
 
               
            /* Check  password and confirm password match */
            if (c !== d) {
                alert("Passwords do not match!");
                return false;
            }

            return true; 
        }
    </script>
</head>
<body>
    <form onsubmit="return validateForm()" action="abc.html">
        <table>
            <tr>
                <td>UserName</td>
                <td><input type="text" id="n1"></td>
            </tr>
            <tr>
                <td>Contact</td>
                <td><input type="text" id="n2"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" id="n3"></td>
            </tr>
            <tr>
                <td>Confirm Password</td>
                <td><input type="password" id="n4"></td>
            </tr>
        </table>
        <input type="submit" value="Submit Your Data">
    </form>   
</body>
</html>
